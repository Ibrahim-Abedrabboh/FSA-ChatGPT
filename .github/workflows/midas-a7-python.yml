name: midas-a7 python service

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/py/**"
      - "tools/n8n_to_flow.py"
      - "n8n/baseline/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "claude-outputs/claude-midas-a7-owner-workspace/**"
      - "claude-runner/**"
      - "tools/claude_*.py"
      - ".github/workflows/midas-a7-python.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/py/**"
      - "tools/n8n_to_flow.py"
      - "n8n/baseline/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "claude-outputs/claude-midas-a7-owner-workspace/**"
      - "claude-runner/**"
      - "tools/claude_*.py"
      - ".github/workflows/midas-a7-python.yml"

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python checks
        run: pip install -e '.[dev]'
      - name: Prepare embedded JavaScript runtime
        run: python claude-runner/runner.py setup
      - name: Verify embedded content and handlers
        run: |
          python claude-runner/runner.py verify
          python claude-runner/runner.py check
      - name: Lint runner and local port tools
        run: ruff check claude-runner/runner.py tools/claude_build_runner.py tools/claude_runner_node_overlay.py tools/claude_runner_test_bootstrap.py tests/py/test_claude_runner.py tests/py/test_claude_runner_parity.py
      - name: Existing Python assertions against runner
        run: python tools/claude_runner_test_bootstrap.py -q tests/py --ignore=tests/py/test_claude_runner_parity.py
      - name: Runner image builds
        run: docker build -f claude-runner/Dockerfile -t midas-a7-runner:ci .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS runner dependencies
        working-directory: src/midas_a7/engine/js
        run: npm ci --no-audit --no-fund
      - name: Install
        run: pip install -e '.[dev]'
      - name: Flow packages match the frozen n8n baselines
        run: |
          python tools/n8n_to_flow.py
          git diff --exit-code -- src/midas_a7/flows src/midas_a7/data
      - name: Every node type has a handler
        run: midas-a7 check
      - name: Lint
        run: ruff check src tests/py tools/n8n_to_flow.py tools/extract_prompt_catalog.py
      - name: Tests
        env:
          MIDAS_JS_NODE_MODULES: ${{ github.workspace }}/src/midas_a7/engine/js/node_modules
        run: |
          python claude-runner/runner.py setup
          python -m pytest -q
      - name: Image builds
        run: docker build -t midas-a7:ci .

  postgres:
    # The store against real Postgres (production's database); every other test uses SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: midas
          POSTGRES_PASSWORD: midas-test
          POSTGRES_DB: a7test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U midas" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Store tests on Postgres
        env:
          MIDAS_TEST_DATABASE_URL: postgresql+psycopg://midas:midas-test@127.0.0.1:5432/a7test
        run: python -m pytest -q tests/py/test_store_postgres.py
