[project]
name = "a7-engine"
version = "0.1.0"
description = "A7 source-analysis engine: drop-in replacement for the n8n owner-analyze path"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
