<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Midas Studio — Owner sign in</title>
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script>
</head>
<body><main class="login-card"><div class="brand"><span class="brand-dot"></span><span>MIDAS <em>STUDIO</em></span></div><p class="eyebrow accent">PRIVATE OWNER PREVIEW</p><h1 id="heading">Welcome back.</h1><p id="description">Sign in with your invited owner account to test the workspace.</p>
<form id="loginForm"><div id="emailField"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"></div><label for="password" id="passwordLabel">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">Sign in →</button></form>
<p id="status" role="status" aria-live="polite">Checking sign-in service…</p><p class="login-note">Invitation only. This preview uses A7 jobs.</p><noscript>Enable JavaScript to sign in.</noscript></main></body></html>
